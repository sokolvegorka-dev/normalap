name: Build iOS IPA

on:
  workflow_dispatch:

jobs:
  ipa:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Flet
        run: pip install "flet[all]==0.86.5"

      - name: Build iOS (no code signing)
        run: flet build ipa --yes --product "НормаЛап" -v

      - name: Package unsigned IPA
        run: |
          set -x
          mkdir -p out
          find build -maxdepth 4 \( -name "*.ipa" -o -name "*.xcarchive" -o -name "*.app" \) | head -50
          IPA=$(find build -name "*.ipa" | head -1 || true)
          if [ -n "$IPA" ]; then
            cp "$IPA" out/NormaLap-iOS.ipa
          else
            APP=$(find build -path "*.xcarchive/Products/Applications/*.app" -maxdepth 8 | head -1)
            if [ -z "$APP" ]; then APP=$(find build -name "Runner.app" | head -1); fi
            mkdir -p Payload
            cp -R "$APP" Payload/
            zip -qr out/NormaLap-iOS.ipa Payload
          fi
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: NormaLap-ios
          path: out/*.ipa
